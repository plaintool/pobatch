[Service]
Name=LLM7 AI - Fast
Order=6
AutoSwapLanguage=1
ColorRecent=3162256
ValueType=Language

RealTimeTranslation=0
TranslateOnlyByButton=0
Visible=1
AllowProxy=1

[Service Description]
0=LLM7.io - Post - this configuration sends a POST request to the LLM7.io chat completions endpoint, which provides access to AI language models through an OpenAI-compatible API format. It can be used either with an API key (for higher rate limits) or anonymously without a key. The request includes a prompt instructing the model to translate text from the source language to the target language while preserving formatting such as line breaks and word wrapping.
1=
2=Official website of the service: https://llm7.io
3=Here you can find documentation, available API features, and up-to-date information about limitations and usage terms.
4=
5=Usage limits for free access (as per https://docs.llm7.io/limits):
6=
7=Without an API key (anonymous):
8=- Requests: 1 per second, 10 per minute, 60 per hour
9=- Token allowance: 500,000 tokens per 24 hours (input + output tokens combined)
10=
11=With a free API key:
12=- Requests: 2 per second, 40 per minute, 100 per hour
13=- Token allowance: 1,000,000 tokens per 24 hours (input + output tokens combined)
14=
15=Legal note: LLM7.io provides public gateway endpoints for free access, primarily intended for testing, experimentation, and low-frequency personal use. These services do not guarantee permanent stability, availability, or consistent behavior.
16=
17=The user is responsible for how this configuration is used. If you need a stable, production-ready, or commercial solution, it is recommended to use official APIs from established providers.

[Request]
Method=POST
EncryptText=1
UserAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36
EncodeText=0
Url=https://api.llm7.io/v1/chat/completions
ContentType=application/json; charset=utf-8
PostData={\r\n  "model": "fast",\r\n  "messages": [\r\n    {\r\n      "role": "system",\r\n      "content": "{prompt}"\r\n    },\r\n    {\r\n      "role": "user",\r\n      "content": "{data}"\r\n    }\r\n  ],\r\n  "temperature": 0.3\r\n}
Accept=*/*
MaxLength=0

[Response]
JsonPointer=/choices/0/message/content;/error/message

[Headers]
0=Connection=keep-alive
1=Authorization=Bearer {LLM7 API key or type anonymous}

[Parameters]
EncodeCustomParameters=0

[Custom Parameters]
prompt=You are a translator. Output only the translation. Preserve all line breaks, punctuation, and original structure. If untranslatable, return the original text unchanged.
data=Translate from {source} to {target}. Text to translate: {text}
LLM7 API key or type anonymous=

